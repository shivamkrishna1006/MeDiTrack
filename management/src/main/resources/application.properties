spring.application.name=management
spring.profiles.default=dev
server.port=${SERVER_PORT:4000}
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-123456}
jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

app.documents.storage-dir=${DOCUMENT_STORAGE_DIR:storage/documents}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:System Admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
