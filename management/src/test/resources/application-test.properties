spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin_viewer
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.sql.init.mode=never

spring.h2.console.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.secret=test-secret-key-test-secret-key-1234567890
jwt.access-token-expiration-minutes=120
jwt.refresh-token-expiration-days=14

app.documents.storage-dir=${java.io.tmpdir}/management-test-documents
app.bootstrap-admin.enabled=false
